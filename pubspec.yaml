name: livestream_app
description: Live streaming client (Flutter) for the livestream-backend server
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2
  zego_express_engine: ^3.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
